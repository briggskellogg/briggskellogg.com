<!doctype html><meta charset="utf-8"><title>Signup tests</title><h1>Signup tests</h1><p>All signup requests are mocked. No messages are sent.</p><pre id="results">Running…</pre>
<script type="module">
const source=await(await fetch('/assets/subscribe.js')).text(),results=[],report=document.querySelector('#results');
const assert=(ok,msg)=>{if(!ok)throw Error(msg)},tick=()=>new Promise(r=>setTimeout(r,0));
async function fixture(){const frame=document.createElement('iframe');frame.style.display='none';document.body.append(frame);const w=frame.contentWindow,d=w.document;d.open();d.write('<meta name="subscribe-endpoint" content="https://signup.invalid"><form data-subscribe-form data-subscribe-source="test"><div class="subscribe-row"><input type="email" required><button type="submit">subscribe →</button></div></form>');d.close();const calls=[];w.fetch=(url,options)=>new Promise((resolve,reject)=>{calls.push({url,options,resolve,reject});options.signal.addEventListener('abort',()=>reject(new w.DOMException('Aborted','AbortError')))});const timer=w.setTimeout.bind(w);w.setTimeout=(fn,ms)=>timer(fn,ms===15000?30:ms);w.eval(source);const form=d.querySelector('form'),input=d.querySelector('input'),button=d.querySelector('button');return {w,d,calls,form,input,button,edit(value){input.value=value;input.dispatchEvent(new w.Event('input',{bubbles:true}))},submit(){form.dispatchEvent(new w.Event('submit',{bubbles:true,cancelable:true}))},reply(data,ok=true,index=0){calls[index].resolve({ok,json:()=>Promise.resolve(data)})},close(){frame.remove()}}}
async function test(name,fn){const f=await fixture();try{await fn(f);results.push('PASS '+name)}catch(e){results.push('FAIL '+name+': '+e.message)}finally{f.close();report.textContent=results.join('\n')}}
await test('invalid input and Enter never send',async f=>{for(const v of ['', 'wrong','a@b','a@@b.com','a b@example.com']){f.edit(v);assert(f.button.disabled,'must disable '+v);f.submit()}assert(f.calls.length===0,'request escaped')});
await test('one request, valid payload, three loading dots, true success',async f=>{f.edit('test+tag@example.com');assert(!f.button.disabled,'disabled');f.submit();f.submit();assert(f.calls.length===1,'duplicate');assert(JSON.parse(f.calls[0].options.body).email==='test+tag@example.com','payload');assert(f.button.querySelectorAll('i').length===3,'loading dots');f.reply({ok:true,outcome:'subscribed'});await tick();assert(f.button.textContent==='subscribed✓','wrong copy');assert(f.input.disabled,'editable')});
await test('confirmation has distinct success copy',async f=>{f.edit('test@example.com');f.submit();f.reply({ok:true,outcome:'confirmation_sent'});await tick();assert(f.button.textContent==='confirmation sent✓','wrong copy')});
await test('network failure quiet; edit enables retry',async f=>{f.edit('test@example.com');f.submit();f.calls[0].reject(Error('network'));await tick();assert(f.button.disabled,'enabled');assert(f.d.querySelector('[data-subscribe-status]').hidden,'visible error');f.submit();assert(f.calls.length===1,'retried');f.edit('fixed@example.com');assert(!f.button.disabled,'edit blocked')});
await test('unknown outcomes cannot claim success',async f=>{f.edit('test@example.com');f.submit();f.reply({ok:true,outcome:'unknown'});await tick();assert(!f.form.classList.contains('is-confirmed'),'false success')});
await test('malformed response cannot claim success',async f=>{f.edit('test@example.com');f.submit();f.calls[0].resolve({ok:true,json:()=>Promise.reject(Error('json'))});await tick();assert(f.button.disabled,'enabled');assert(!f.form.classList.contains('is-confirmed'),'false success')});
await test('pending edit aborts and ignores stale response',async f=>{f.edit('old@example.com');f.submit();f.edit('new@example.com');assert(f.calls[0].options.signal.aborted,'not aborted');f.reply({ok:true,outcome:'subscribed'});await tick();assert(!f.form.classList.contains('is-confirmed'),'stale success');assert(!f.button.disabled,'new blocked');f.submit();f.reply({ok:true,outcome:'subscribed'},true,1);await tick();assert(f.form.classList.contains('is-confirmed'),'latest failed')});
await test('timeout stops stalled loading',async f=>{f.edit('test@example.com');f.submit();await new Promise(r=>setTimeout(r,60));assert(f.calls[0].options.signal.aborted,'no timeout');assert(f.button.disabled,'enabled');assert(!f.form.hasAttribute('aria-busy'),'still loading')});
report.textContent+='\n\n'+results.filter(x=>x.startsWith('PASS')).length+'/'+results.length+' passed';document.title=results.some(x=>x.startsWith('FAIL'))?'FAIL — signup tests':'PASS — signup tests';
</script>
